# Requires: ingress-nginx + cert-manager with a ClusterIssuer named 'letsencrypt-prod'
# Update the host values to your real domain before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: turnbased
  namespace: turnbased
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ── WebSocket support for Colyseus ──────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # ── Security headers ────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - turnbased.euroclasstravel.com       # <-- update
        - api.turnbased.euroclasstravel.com   # <-- update
      secretName: turnbased-tls
  rules:
    # Frontend
    - host: turnbased.euroclasstravel.com     # <-- update
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  name: http
    # Backend — REST + WebSocket on the same host/port
    - host: api.turnbased.euroclasstravel.com # <-- update
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  name: http
