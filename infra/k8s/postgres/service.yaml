apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: turnbased
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  clusterIP: None  # headless — StatefulSet pods get stable DNS: postgres-0.postgres.turnbased.svc.cluster.local
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
