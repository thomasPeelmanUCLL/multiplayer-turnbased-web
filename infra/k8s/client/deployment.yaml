apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: turnbased
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: client
          # TODO: replace tag with the sha- tag output by the docker-build-push workflow
          image: ghcr.io/thomaspeelmanucll/turnbased-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
