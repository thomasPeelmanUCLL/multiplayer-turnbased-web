apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: turnbased
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  # NOTE: Colyseus stores in-memory room state by default.
  # Keep replicas: 1 until you configure the Colyseus distributed driver
  # backed by Redis (REDIS_URL is already wired in). Once you do, you can
  # safely scale replicas and enable RollingUpdate below.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: server
          # TODO: replace tag with the sha- tag output by the docker-build-push workflow
          image: ghcr.io/thomaspeelmanucll/turnbased-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2567
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "2567"
            - name: JWT_ACCESS_EXPIRES_IN
              value: "15m"
            - name: JWT_REFRESH_EXPIRES_DAYS
              value: "7"
            - name: LOG_LEVEL
              value: info
            - name: FRONTEND_ORIGIN
              # Update to your real domain — must match your Ingress host
              value: "https://turnbased.example.com"
          envFrom:
            - secretRef:
                name: turnbased-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 2567
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 2567
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
