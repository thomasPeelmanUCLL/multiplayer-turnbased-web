# EDIT THIS FILE LOCALLY — do NOT commit real secret values.
# After filling in the base64-encoded values, apply once:
#   kubectl apply -f infra/k8s/secrets.yaml
#
# Encode a value:  echo -n 'my-secret' | base64
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: turnbased-secrets
  namespace: turnbased
type: Opaque
data:
  # postgres://user:password@postgres:5432/turnbased
  DATABASE_URL: cG9zdGdyZXM6Ly90dXJuYmFzZWQ6Y2hhbmdlbWVAcG9zdGdyZXM6NTQzMi90dXJuYmFzZWQ=
  # redis://redis:6379
  REDIS_URL: cmVkaXM6Ly9yZWRpczozNjc5
  # openssl rand -hex 64  (then base64-encode the result)
  JWT_ACCESS_SECRET: cmVwbGFjZV9tZV93aXRoX2FfcmVhbF82NF9ieXRlX2hleA==
  JWT_REFRESH_SECRET: cmVwbGFjZV9tZV93aXRoX2FfZGlmZmVyZW50XzY0X2J5dGVfaGV4
  # Postgres credentials (must match postgres/statefulset.yaml)
  POSTGRES_PASSWORD: Y2hhbmdlbWU=
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: turnbased
type: kubernetes.io/dockerconfigjson
data:
  # Generate with:
  #   kubectl create secret docker-registry ghcr-pull-secret \
  #     --docker-server=ghcr.io \
  #     --docker-username=<github-user> \
  #     --docker-password=<github-pat-with-read:packages> \
  #     --namespace=turnbased \
  #     --dry-run=client -o yaml
  .dockerconfigjson: e30K
