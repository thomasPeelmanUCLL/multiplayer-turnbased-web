# Local development stack.
# Start everything with: docker compose -f infra/docker-compose.yml up
# Requires a .env file in the repo root (copy .env.example and fill it in).

name: turnbased-dev

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       turnbased
      POSTGRES_USER:     dev
      POSTGRES_PASSWORD: dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d turnbased']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    ports:
      - '2567:2567'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    ports:
      - '5173:5173'
    depends_on:
      - server

volumes:
  postgres-data:
