# ── Release ───────────────────────────────────────────────────────────────────
# Creates a GitHub Release and triggers the Docker build/push workflow
# when you push a semver tag (e.g. `git tag v1.0.0 && git push --tags`).
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for auto-generated changelog

      - name: Generate release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
